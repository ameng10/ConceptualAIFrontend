<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ConceptualAI — describe your app, get the codebase">
  <!--
    The social card. Every share of this domain currently previews as a bare link, which is
    the cheapest credibility to leave on the table. 1200×630 is the size Open Graph and
    Twitter both crop from, so it renders without a second asset.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#111c2e" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="6" fill="url(#accent)" />

  <g transform="translate(88, 150)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="30" font-weight="700" fill="#2dd4bf" letter-spacing="3">CONCEPTUALAI</text>

    <text y="110" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="76" font-weight="800" fill="#f8fafc">Describe your app.</text>
    <text y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="76" font-weight="800" fill="#f8fafc">Get the codebase.</text>

    <text y="286" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="30" font-weight="500" fill="#94a3b8">
      Tested Deno backend · React frontend · API docs · You own the code
    </text>
  </g>
</svg>
